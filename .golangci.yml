version: "2"
run:
  tests: true
linters:
  enable:
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      disabled-checks:
        - ifElseChain
        - assignOp
        - dupBranchBody
        - unlambda
        - dupArg
    misspell:
      locale: US
    staticcheck:
      # Defaults minus the quickfix (QF) suggestions, which are style hints
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF*
    revive:
      rules:
        - name: increment-decrement
          disabled: true
        - name: redefines-builtin-id
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
        path: _test\.go
      - linters:
          - errcheck
          - gocritic
        path: cmd/
    paths:
      - benchmarks/generated
      - benchmarks/curated
      - benchmarks/mass_generated
      - examples/generated
      - output
      - vendor
      - third_party$
      - builtin$
      - examples/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - benchmarks/generated
      - benchmarks/curated
      - benchmarks/mass_generated
      - examples/generated
      - output
      - vendor
      - third_party$
      - builtin$
      - examples/
